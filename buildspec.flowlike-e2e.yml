version: 0.2
env:
  shell: bash
phases:
  install:
    runtime-versions:
      golang: 1.24
    commands:
      - go version
  build:
    commands:
      - |
        set -euo pipefail
        echo "Source: $(git rev-parse HEAD)"
        test "$(git rev-parse HEAD)" = "$CODEBUILD_RESOLVED_SOURCE_VERSION"
        if [[ -n "${FLOWLIKE_BASE_SHA:-}" ]]; then
          echo "Changes since ${FLOWLIKE_BASE_SHA}:"
          git diff --name-only "$FLOWLIKE_BASE_SHA" HEAD
        fi
        cd demo/flowlike
        docker compose -f compose.yaml up -d --wait --wait-timeout 300
        cleanup() {
          for pid in ${api_pid:-} ${worker_pid:-}; do
            if [[ -n "$pid" ]]; then kill "$pid" 2>/dev/null || true; fi
          done
          docker compose -f compose.yaml logs --tail 25 || true
          docker compose -f compose.yaml down -v || true
        }
        trap cleanup EXIT
        cd ../..
        echo 'Build target: ./demo/flowlike/cmd/flowlike (no application Docker image build)'
        go build -o /tmp/flowlike ./demo/flowlike/cmd/flowlike
        /tmp/flowlike -role worker >/tmp/flowlike-worker.log 2>&1 & worker_pid=$!
        /tmp/flowlike -role api >/tmp/flowlike-api.log 2>&1 & api_pid=$!
        for i in $(seq 1 30); do
          if curl -fsS http://127.0.0.1:8099/health >/dev/null; then break; fi
          sleep 1
        done
        curl -fsS http://127.0.0.1:8099/health >/dev/null
        FLOWLIKE_E2E=1 go test -count=1 -v -run '^TestFlowlikeE2E$' ./demo/flowlike/e2e
