version: 0.2

env:
  shell: bash

phases:
  install:
    runtime-versions:
      golang: 1.24
    commands:
      - go version
  build:
    commands:
      - |
        set -euo pipefail
        HEAD_SHA=$(git rev-parse HEAD)
        test "$HEAD_SHA" = "${CODEBUILD_RESOLVED_SOURCE_VERSION:?source version is missing}"
        case "${CODEBUILD_WEBHOOK_TRIGGER:-}" in
          pr/*) ;;
          *) echo 'This project requires a pull-request webhook event.' >&2; exit 2 ;;
        esac
        BASE_REF=${CODEBUILD_WEBHOOK_BASE_REF:?pull-request base ref is missing}
        test "$BASE_REF" = 'refs/heads/aayush/hexagon-ci-pr-base'
        echo 'go-zero baseline: no Hexagon selection; full root-module Go suite.'
        TEST_START=$(date +%s)
        set +e
        go test -count=1 -skip '^TestNewFileWriter$/^access$' ./...
        TEST_STATUS=$?
        set -e
        TEST_END=$(date +%s)
        echo "BENCH_TEST_SECONDS=$((TEST_END - TEST_START))"
        echo "BENCH_TEST_STATUS=$TEST_STATUS"
        exit "$TEST_STATUS"
